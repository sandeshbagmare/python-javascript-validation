name: Parser comparison
on:
  push:
    paths: ['.github/workflows/benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: tree-sitter
            packages: 'tree-sitter==0.26.1 tree-sitter-javascript==0.25.0'
          - candidate: esprima
            packages: 'esprima==4.0.1'
          - candidate: esprima-fork
            packages: 'esprima-fork==5.0.0'
          - candidate: esprima2
            packages: 'esprima2==6.0.0'
          - candidate: oxc-python
            packages: 'oxc-python==0.1.1'
          - candidate: acorn-quickjs
            packages: 'quickjs-ng==0.18.0.1'
          - candidate: acorn-v8
            packages: 'mini-racer==0.14.1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned candidate
        run: python -m pip install ${{ matrix.packages }}
      - name: Materialize shared experiment
        shell: python
        run: |
          from pathlib import Path
          import hashlib, urllib.request
          Path('benchmark.py').write_text('"""Measured parser comparison. Submitted source is passed as data, never run."""\nimport argparse\nfrom datetime import datetime, timezone\nimport hashlib\nimport importlib.metadata\nimport json\nfrom pathlib import Path\nimport platform\nimport statistics\nimport sys\nimport time\n\nROOT = Path(__file__).parent\nWRAPPER = """\nfunction validateSource(source, mode) {\n  try {\n    acorn.parse(source, {ecmaVersion: 2025, sourceType: mode});\n    return {status: "valid"};\n  } catch (e) {\n    if (!(e instanceof SyntaxError)) throw e;\n    return {status: "invalid", diagnostic: e.message,\n            line: e.loc.line, column: e.loc.column};\n  }\n}\n"""\n\n\ndef adapter(name):\n    if name in ("esprima", "esprima2", "esprima-fork"):\n        import esprima\n        options = {"tolerant": False, "jsx": False}\n        if name == "esprima-fork":\n            options["ecmaVersion"] = 2025\n        def check(source, mode):\n            try:\n                method = esprima.parseModule if mode == "module" else esprima.parseScript\n                method(source, options)\n                return {"status": "valid"}\n            except esprima.error_handler.Error as exc:\n                if name == "esprima-fork" and "nesting exceeds the" in str(exc) and "resource limit" in str(exc):\n                    return {"status": "resource_limit", "diagnostic": str(exc)}\n                return {"status": "invalid", "diagnostic": str(exc)}\n        return check, None\n    if name == "tree-sitter":\n        from tree_sitter import Language, Parser\n        import tree_sitter_javascript\n        parser = Parser(Language(tree_sitter_javascript.language()))\n        def check(source, mode):\n            tree = parser.parse(source.encode("utf-8"))\n            return {"status": "invalid" if tree.root_node.has_error else "valid"}\n        return check, None\n    if name == "oxc-python":\n        import oxc_python\n        def check(source, mode):\n            result = oxc_python.parse(source, source_type=mode)\n            if result.panicked and not result.errors:\n                return {"status": "validator_failure", "diagnostic": "Oxc parser panicked"}\n            return {"status": "invalid" if result.errors else "valid"}\n        return check, None\n    if name == "acorn-v8":\n        from py_mini_racer import MiniRacer\n        context = MiniRacer()\n        context.eval((ROOT / "acorn.js").read_text(encoding="utf-8"))\n        context.eval(WRAPPER)\n        return lambda source, mode: context.call("validateSource", source, mode, timeout=2000), context\n    if name == "acorn-quickjs":\n        import quickjs\n        context = quickjs.Context()\n        context.set_memory_limit(128 * 1024 * 1024)\n        context.set_time_limit(2)\n        context.eval((ROOT / "acorn.js").read_text(encoding="utf-8"))\n        context.eval(WRAPPER)\n        call = context.get("validateSource")\n        return lambda source, mode: json.loads(call(source, mode).json()), None\n    raise ValueError(name)\n\n\ndef main():\n    cli = argparse.ArgumentParser()\n    cli.add_argument("candidate")\n    args = cli.parse_args()\n    cases = json.loads((ROOT / "cases.json").read_text(encoding="utf-8"))\n    for extra in sorted(ROOT.glob("challenge-*.json")):\n        cases.extend(json.loads(extra.read_text(encoding="utf-8")))\n    assert len({case[0] for case in cases}) == len(cases), "Duplicate case IDs"\n    result = {\n        "candidate": args.candidate, "python": platform.python_version(),\n        "platform": platform.platform(), "ecmascript_contract": 2025,\n        "cases_sha256": hashlib.sha256(json.dumps(cases, ensure_ascii=False).encode()).hexdigest(),\n        "case_count": len(cases),\n        "timestamp_utc": datetime.now(timezone.utc).isoformat(),\n        "benchmark_sha256": hashlib.sha256(Path(__file__).read_bytes()).hexdigest(),\n        "acorn_sha256": hashlib.sha256((ROOT / "acorn.js").read_bytes()).hexdigest(),\n        "acorn_version": "8.19.0",\n        "edition_selection": "explicit 2025" if args.candidate in ("esprima-fork", "acorn-v8", "acorn-quickjs") else "not selected; package default grammar",\n        "executable": sys.executable,\n        "versions": {d.metadata["Name"]: d.version for d in importlib.metadata.distributions()},\n    }\n    resource = None\n    try:\n        check, resource = adapter(args.candidate)\n    except Exception as exc:\n        result.update(status="unavailable", reason=f"{type(exc).__name__}: {exc}")\n    else:\n        rows = []\n        for case_id, mode, expected, group, source in cases:\n            try:\n                actual = check(source, mode)\n            except Exception as exc:\n                actual = {"status": "validator_failure", "diagnostic": f"{type(exc).__name__}: {exc}"}\n            rows.append(dict(id=case_id, mode=mode, expected=expected, group=group, **actual))\n        # Warm, tiny-source latency includes the binding and verdict conversion, not setup.\n        durations = []\n        timing_failure = None\n        for _ in range(5):\n            start = time.perf_counter_ns()\n            attempts = 0\n            for row, case in zip(rows, cases):\n                if row["status"] in ("valid", "invalid"):\n                    try:\n                        check(case[4], case[1])\n                        attempts += 1\n                    except Exception as exc:\n                        timing_failure = f"{type(exc).__name__}: {exc}"\n            if attempts:\n                durations.append((time.perf_counter_ns() - start) / attempts / 1000)\n        resource_probes = []\n        for depth in (32, 100, 300):\n            try:\n                probe = check("(" * depth + "0" + ")" * depth + ";", "script")\n            except Exception as exc:\n                probe = {"status": "validator_failure", "diagnostic": f"{type(exc).__name__}: {exc}"}\n            resource_probes.append({"depth": depth, "expected": True, **probe})\n        result.update(\n            status="measured", cases=rows,\n            false_accepts=[r["id"] for r in rows if not r["expected"] and r["status"] == "valid"],\n            false_rejects=[r["id"] for r in rows if r["expected"] and r["status"] == "invalid"],\n            failures=[r["id"] for r in rows if r["status"] == "validator_failure"],\n            inconclusive=[r["id"] for r in rows if r["status"] not in ("valid", "invalid")],\n            resource_probes=resource_probes,\n            timing_failure=timing_failure,\n            timed_case_count=sum(r["status"] in ("valid", "invalid") for r in rows),\n            warm_microseconds_per_case_median=statistics.median(durations) if durations else None,\n        )\n    finally:\n        if resource is not None:\n            resource.close()\n    path = ROOT / f"results-{args.candidate}.json"\n    path.write_text(json.dumps(result, indent=2), encoding="utf-8")\n    print(json.dumps({k: v for k, v in result.items() if k not in ("cases", "versions")}, indent=2))\n\n\nif __name__ == "__main__":\n    main()\n', encoding='utf-8')
          Path('cases.json').write_text('[\n  ["optional-chain","script",true,"modern","const n = obj?.value ?? 0;"],\n  ["bigint-separator","script",true,"modern","let n = 1_000n; n ??= 0n;"],\n  ["class-fields","script",true,"modern","class C { #x=1; static { this.ready=true; } get(){ return this.#x; } }"],\n  ["async-function","script",true,"modern","async function f(){ await Promise.resolve(); }"],\n  ["module-import-await","module",true,"context","import x from \'./missing.js\'; export default await x;"],\n  ["dynamic-import-script","script",true,"modern","import(\'./missing.js\');"],\n  ["dynamic-import-module","module",true,"modern","import(\'./missing.js\');"],\n  ["sloppy-params","script",true,"context","function f(a,a){ return a; }"],\n  ["sloppy-with","script",true,"context","with ({x:1}) { x; }"],\n  ["labeled-break","script",true,"control","label: { break label; }"],\n  ["switch-break","script",true,"control","switch(x){ case 1: break; }"],\n  ["shadow-binding","script",true,"binding","let x; { let x; }"],\n  ["named-regex","script",true,"regex","const r=/(?<name>a)\\\\k<name>/u; const n=6/2;"],\n  ["regex-v","script",true,"modern","const r=/[a&&b]/v;"],\n  ["regex-modifiers","script",true,"modern","const r=/(?i:a)/;"],\n  ["regex-duplicate-alternatives","script",true,"modern","const r=/(?<x>a)|(?<x>b)/;"],\n  ["import-attributes","module",true,"modern","import data from \'./a.json\' with {type:\'json\'};"],\n  ["object-spread","script",true,"modern","const x={...obj}; const {a,...rest}=x;"],\n  ["optional-catch","script",true,"modern","try { f(); } catch {}"],\n  ["logical-assignment","script",true,"modern","x ||= 1; y &&= 2; z ??= 3;"],\n  ["private-in","script",true,"modern","class C { #x; has(o){ return #x in o; } }"],\n  ["async-generator","script",true,"modern","async function* f(){ yield await p; }"],\n  ["for-await","script",true,"modern","async function f(){ for await (const x of xs) {} }"],\n  ["unicode-source","script",true,"grammar","const greeting=\'😀\'; const café=1;"],\n  ["asi","script",true,"grammar","let x=1\\nx++"],\n  ["function-return","script",true,"control","function f(){return 1;}"],\n  ["loop-break","script",true,"control","while(true){break;}"],\n  ["labeled-continue","script",true,"control","outer: for(;;){continue outer;}"],\n  ["module-await","module",true,"context","await 1;"],\n  ["module-import-meta","module",true,"context","import.meta;"],\n  ["module-export","module",true,"context","export const x=1;"],\n  ["regex-constructor-runtime","script",true,"runtime-control","new RegExp(\'(\');"],\n  ["undefined-runtime","script",true,"runtime-control","missingFunction();"],\n  ["const-assignment-runtime","script",true,"runtime-control","const x=1; x=2;"],\n  ["tdz-runtime","script",true,"runtime-control","let x=x;"],\n  ["throw-runtime","script",true,"runtime-control","throw new Error(\'boom\');"],\n  ["infinite-loop-runtime","script",true,"runtime-control","while(true){}"],\n  ["dom-runtime","script",true,"runtime-control","document.querySelector(\'#missing\').remove();"],\n  ["empty-script","script",true,"grammar",""],\n  ["empty-module","module",true,"grammar",""],\n  ["missing-expression","script",false,"grammar","const x=;"],\n  ["missing-brace","script",false,"grammar","function f() {"],\n  ["unclosed-string","script",false,"grammar","const x=\'oops;"],\n  ["unclosed-template","script",false,"grammar","const x=`hello ${x};"],\n  ["top-return","script",false,"control","return 1;"],\n  ["module-return","module",false,"control","return 1;"],\n  ["top-break","script",false,"control","break;"],\n  ["top-continue","script",false,"control","continue;"],\n  ["bad-continue-label","script",false,"control","label: {continue label;}"],\n  ["function-break-boundary","script",false,"control","while(true){ function f(){break;} }"],\n  ["missing-label","script",false,"control","break missing;"],\n  ["duplicate-let","script",false,"binding","let x; let x;"],\n  ["let-var-conflict","script",false,"binding","let x; var x;"],\n  ["strict-duplicate-params","script",false,"strict","\'use strict\'; function f(a,a){}"],\n  ["module-duplicate-params","module",false,"strict","function f(a,a){}"],\n  ["strict-nonsimple-params","script",false,"strict","function f(a=1){\'use strict\';}"],\n  ["strict-with","script",false,"strict","\'use strict\'; with({}){}"],\n  ["module-with","module",false,"strict","with({}){}"],\n  ["strict-delete","script",false,"strict","\'use strict\'; delete x;"],\n  ["strict-eval-binding","script",false,"strict","\'use strict\'; let eval;"],\n  ["script-await","script",false,"context","await 1;"],\n  ["script-static-import","script",false,"context","import x from \'x\';"],\n  ["script-import-meta","script",false,"context","import.meta;"],\n  ["script-export","script",false,"context","export const x=1;"],\n  ["missing-export","module",false,"binding","export {missing};"],\n  ["missing-private","script",false,"binding","class C { m(){return this.#missing;} }"],\n  ["regex-pattern","script",false,"regex","const r=/(/;"],\n  ["regex-range","script",false,"regex","const r=/[z-a]/;"],\n  ["regex-duplicate-flags","script",false,"regex","const r=/a/gg;"],\n  ["regex-unknown-flags","script",false,"regex","const r=/a/z;"],\n  ["regex-conflicting-flags","script",false,"regex","const r=/a/uv;"],\n  ["nullish-mixing","script",false,"grammar","const x=a ?? b || c;"],\n  ["optional-assignment","script",false,"grammar","obj?.x=1;"],\n  ["jsx","script",false,"language","const x=<div/>;"],\n  ["typescript","script",false,"language","const x: number=1;"],\n  ["const-no-init","script",false,"grammar","const x;"],\n  ["try-no-handler","script",false,"grammar","try {}"],\n  ["duplicate-constructor","script",false,"binding","class C {constructor(){} constructor(){}}"],\n  ["super-outside","script",false,"context","super.x;"],\n  ["new-target-outside","script",false,"context","new.target;"],\n  ["throw-newline","script",false,"grammar","throw\\nnew Error();"],\n  ["unicode-before-error","script",false,"grammar","const emoji=\'😀\'; const x=;"]\n]\n', encoding='utf-8')
          Path('challenge-scopes.json').write_text('[\n  ["scope-catch-pattern-var-conflict","script",false,"scope","try {} catch ({x}) { var x; }"],\n  ["scope-catch-pattern-nested-function-var","script",true,"scope","try {} catch ({x}) { function f() { var x; } }"],\n  ["scope-parameter-body-let-conflict","script",false,"binding","function f({x}) { let x; }"],\n  ["scope-parameter-nested-let-shadow","script",true,"binding","function f({x}) { { let x; } }"],\n  ["scope-switch-shared-lexical-conflict","script",false,"scope","switch (0) { case 0: let x; break; default: let x; }"],\n  ["scope-switch-block-lexical-shadow","script",true,"scope","switch (0) { case 0: { let x; break; } default: { let x; } }"],\n  ["scope-for-head-body-var-conflict","script",false,"scope","for (let x of []) { { var x; } }"],\n  ["scope-for-head-body-let-shadow","script",true,"scope","for (let x of []) { let x; }"],\n  ["scope-strict-directive-retroactive-arguments-binding","script",false,"strict","function f(arguments) { \'use strict\'; }"],\n  ["scope-escaped-directive-arguments-binding","script",true,"strict","function f(arguments) { \'use\\\\x20strict\'; }"],\n  ["scope-private-accessor-static-instance-conflict","script",false,"classes","class C { get #x() { return 1; } static set #x(v) {} }"],\n  ["scope-private-accessor-instance-pair","script",true,"classes","class C { get #x() { return 1; } set #x(v) {} }"],\n  ["scope-static-block-arrow-arguments","script",false,"classes","class C { static { const f = () => arguments; } }"],\n  ["scope-static-block-function-arguments","script",true,"classes","class C { static { const f = function () { return arguments; }; } }"],\n  ["scope-regex-duplicate-names-separate-disjunctions","script",false,"regex","const r = /(?:(?<x>a)|b)(?:c|(?<x>d))/u;"],\n  ["scope-regex-duplicate-names-nested-alternatives","script",true,"regex","const r = /(?:(?<x>a)|(?:b|(?<x>c)))/u;"],\n  ["scope-regex-v-mixed-set-operators","script",false,"regex","const r = /[a&&b--c]/v;"],\n  ["scope-regex-v-nested-set-operators","script",true,"regex","const r = /[[a&&b]--c]/v;"],\n  ["scope-module-import-local-collision","module",false,"binding","import {x} from \'./missing.js\'; const x = 1; export {x};"],\n  ["scope-module-import-local-alias","module",true,"binding","import {x as importedX} from \'./missing.js\'; const x = 1; export {x, importedX};"],\n  ["scope-private-inner-name-not-visible-in-outer","script",false,"classes","class Outer { make() { return class Inner { #x; }; } read(o) { return o.#x; } }"],\n  ["scope-private-outer-name-visible-in-inner","script",true,"classes","class Outer { #x; make() { return class Inner { read(o) { return o.#x; } }; } }"],\n  ["scope-object-duplicate-prototype-setters","script",false,"grammar","const o = { __proto__: null, \'__proto__\': null };"],\n  ["scope-object-computed-proto-is-data-property","script",true,"grammar","const o = { __proto__: null, [\'__proto__\']: null };"],\n  ["scope-sloppy-arrow-duplicate-parameters","script",false,"binding","const f = (x, x) => x;"]\n]\n', encoding='utf-8')
          data = urllib.request.urlopen('https://unpkg.com/acorn@8.19.0/dist/acorn.js', timeout=30).read()
          assert hashlib.sha256(data).hexdigest() == 'b95392d79457d0357555c5ed3e56302d074b92dff119bcf3b44179500b10e9df'
          Path('acorn.js').write_bytes(data)
      - name: Measure without executing submitted JavaScript
        run: python benchmark.py ${{ matrix.candidate }}
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.candidate }}
          path: results-*.json
