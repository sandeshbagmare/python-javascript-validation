name: Parser comparison
on:
  push:
    paths: ['.github/workflows/benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: tree-sitter
            packages: 'tree-sitter==0.26.1 tree-sitter-javascript==0.25.0'
          - candidate: esprima
            packages: 'esprima==4.0.1'
          - candidate: esprima-fork
            packages: 'esprima-fork==5.0.0'
          - candidate: esprima2
            packages: 'esprima2==6.0.0'
          - candidate: oxc-python
            packages: 'oxc-python==0.1.1'
          - candidate: acorn-quickjs
            packages: 'quickjs-ng==0.18.0.1'
          - candidate: acorn-v8
            packages: 'mini-racer==0.14.1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned candidate
        run: python -m pip install ${{ matrix.packages }}
      - name: Materialize shared experiment
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, urllib.request, zlib
          Path('benchmark.py').write_bytes(zlib.decompress(base64.b64decode('')))
          Path('cases.json').write_bytes(zlib.decompress(base64.b64decode('')))
          Path('tree_sitter_screen.py').write_bytes(zlib.decompress(base64.b64decode('')))
          Path('acorn_validator.py').write_bytes(zlib.decompress(base64.b64decode('')))
          Path('integration.py').write_bytes(zlib.decompress(base64.b64decode('')))
          Path('challenge-scopes.json').write_bytes(zlib.decompress(base64.b64decode('')))
          Path('challenge-standards.json').write_bytes(zlib.decompress(base64.b64decode('')))
          data = urllib.request.urlopen('https://unpkg.com/acorn@8.19.0/dist/acorn.js', timeout=30).read()
          assert hashlib.sha256(data).hexdigest() == 'b95392d79457d0357555c5ed3e56302d074b92dff119bcf3b44179500b10e9df'
          Path('acorn.js').write_bytes(data)
      - name: Measure without executing submitted JavaScript
        run: python benchmark.py ${{ matrix.candidate }}
      - name: Check article Tree-sitter snippet
        if: matrix.candidate == 'tree-sitter'
        run: python tree_sitter_screen.py
      - name: Check article Acorn snippet
        if: matrix.candidate == 'acorn-v8'
        run: python acorn_validator.py
      - name: Check article pure-Python snippet
        if: matrix.candidate == 'esprima-fork'
        run: python integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.candidate }}
          path: results-*.json
